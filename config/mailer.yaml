from: example@example.com
log_level: info
smtp:
  host: localhost:1025
  password: "" # Can be specified in the environment variable SECBAN_MAILER_SMTP_PASSWORD
  username: "" # Can be specified in the environment variable SECBAN_MAILER_SMTP_USERNAME
  # TLS policy: notls, opportunistic, mandatory (default: opportunistic).
  tls: opportunistic
socket_path: "/var/run/secban/mailer.sock"
state_file: /var/run/secban/mailer_report
template_file: ""
to:
  - recipient@example.com
  - anotherrecipient@example.com
frequency: 2h
threshold: 10
