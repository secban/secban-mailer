# yaml-language-server: $schema=https://nfpm.goreleaser.com/schema.json
name: "secban-mailer"
arch: "${ARCH}"
platform: "${GOOS}"
version: "${VERSION}"
section: "net"
priority: "optional"
maintainer: "Pascal <pm98zz.c@gmail.com>"
description: "Alert dispatch daemon for the SecBan framework"
vendor: "SecBan"
homepage: "https://gitlab.com/secban/secban-mailer"
license: "GPL-3.0"

scripts:
  preinstall: "./preinstall.sh"
  postinstall: "./postinstall.sh"
  preremove: "./preremove.sh"
  postremove: "./postremove.sh"

contents:
  - src: "${BIN_DIR}/secban-mailer"
    dst: "/usr/sbin/secban-mailer"
    expand: true
    file_info:
      mode: 0755
  - src: "${BIN_DIR}/secban-mailer-emailcheck"
    dst: "/usr/bin/secban-mailer-emailcheck"
    expand: true
    file_info:
      mode: 0755
  - src: "${REPO_DIR}/config/mailer.yaml"
    dst: "/etc/secban/mailer.yaml"
    expand: true
    type: "config|noreplace"
    file_info:
      mode: 0640
      owner: "root"
      group: "secban"
  - src: "${REPO_DIR}/_scripts/systemd/secban-mailer.service"
    dst: "/lib/systemd/system/secban-mailer.service"
    expand: true
    file_info:
      mode: 0644
  - dst: "/var/run/secban"
    type: dir
    file_info:
      mode: 0770
      owner: "secban"
      group: "secban"
